<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chirp - Friend Requests</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body {
            background-color: #050505;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            height: 60px;
            background: rgba(12, 12, 12, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: #141414;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #cccccc;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.1s, color 0.1s;
        }
        .back-btn:hover { background: #1f1f1f; color: #ffffff; }

        .container {
            max-width: 700px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 24px;
            color: #ffffff;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #888888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            margin-top: 24px;
        }

        .request-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .request-card {
            background: #121212;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: border-color 0.1s;
        }
        .request-card:hover { border-color: rgba(255, 255, 255, 0.12); }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pfp {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #1c1c1c;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #ffffff;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .username {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background 0.1s, opacity 0.1s;
        }
        .btn:hover { opacity: 0.9; }

        .btn.accept { background: #81c995; color: #05200c; }
        .btn.deny { background: rgba(242, 139, 130, 0.15); color: #f28b82; }
        .btn.deny:hover { background: rgba(242, 139, 130, 0.25); }
        .btn.cancel { background: #222222; color: #cccccc; }
        .btn.cancel:hover { background: #2a2a2a; color: #ffffff; }

        .empty-state {
            font-size: 13px;
            color: #666666;
            padding: 12px 0;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <a href="/chat.html" class="back-btn">← Back to Chat</a>
        </div>
    </div>

    <div class="container">
        <h1>Manage Friend Requests</h1>

        <div class="section-title">Incoming Requests</div>
        <div id="incoming-list" class="request-list">
            <div class="empty-state">Loading incoming requests...</div>
        </div>

        <div class="section-title">Outgoing Requests</div>
        <div id="outgoing-list" class="request-list">
            <div class="empty-state">Loading outgoing requests...</div>
        </div>

        <div class="section-title">Current Friends</div>
        <div id="friends-list" class="request-list">
            <div class="empty-state">Loading friends...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
    <script>
        let supabaseClient;
        let currentUser = null;

        async function init() {
            try {
                if (!Cookies.get('chirp_session')) {
                    return window.location.replace('/');
                }

                const res = await fetch('/api/config');
                const config = await res.json();
                supabaseClient = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);

                const { data: { user }, error } = await supabaseClient.auth.getUser();
                if (error || !user) {
                    Cookies.remove('chirp_session', { path: '/' });
                    return window.location.replace('/');
                }
                currentUser = user;

                await loadFriendships();
            } catch (err) {
                console.error('Init error:', err);
            }
        }
        init();

        async function loadFriendships() {
            try {
                // Fetch all friendships where current user is sender or receiver
                const { data: friendships, error } = await supabaseClient
                    .from('friendships')
                    .select('*')
                    .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`);

                if (error) throw error;

                if (!friendships || friendships.length === 0) {
                    document.getElementById('incoming-list').innerHTML = '<div class="empty-state">No incoming requests.</div>';
                    document.getElementById('outgoing-list').innerHTML = '<div class="empty-state">No outgoing requests.</div>';
                    document.getElementById('friends-list').innerHTML = '<div class="empty-state">No friends added yet.</div>';
                    return;
                }

                // Extract all unique user IDs involved
                const userIds = new Set();
                friendships.forEach(f => {
                    userIds.add(f.sender_id);
                    userIds.add(f.receiver_id);
                });

                // Fetch profiles for all involved users
                const { data: profiles, error: profileErr } = await supabaseClient
                    .from('profiles')
                    .select('id, username, avatar_url')
                    .in('id', Array.from(userIds));

                if (profileErr) throw profileErr;

                const profileMap = {};
                profiles.forEach(p => {
                    profileMap[p.id] = p;
                });

                const incomingEl = document.getElementById('incoming-list');
                const outgoingEl = document.getElementById('outgoing-list');
                const friendsEl = document.getElementById('friends-list');

                incomingEl.innerHTML = '';
                outgoingEl.innerHTML = '';
                friendsEl.innerHTML = '';

                let incomingCount = 0;
                let outgoingCount = 0;
                let friendsCount = 0;

                friendships.forEach(f => {
                    const isSender = f.sender_id === currentUser.id;
                    const otherUserId = isSender ? f.receiver_id : f.sender_id;
                    const profile = profileMap[otherUserId] || { username: 'Unknown User', avatar_url: null };
                    
                    const avatarContent = profile.avatar_url 
                        ? `<img src="${profile.avatar_url}" class="pfp" alt="PFP">` 
                        : `<div class="pfp">${profile.username.charAt(0).toUpperCase()}</div>`;

                    if (f.status === 'pending') {
                        if (!isSender) {
                            // Incoming pending request
                            incomingCount++;
                            incomingEl.innerHTML += `
                                <div class="request-card">
                                    <div class="user-info">
                                        ${avatarContent}
                                        <span class="username">${profile.username}</span>
                                    </div>
                                    <div class="actions">
                                        <button class="btn accept" onclick="updateStatus('${f.id}', 'accepted')">Accept</button>
                                        <button class="btn deny" onclick="updateStatus('${f.id}', 'denied')">Deny</button>
                                    </div>
                                </div>
                            `;
                        } else {
                            // Outgoing pending request
                            outgoingCount++;
                            outgoingEl.innerHTML += `
                                <div class="request-card">
                                    <div class="user-info">
                                        ${avatarContent}
                                        <span class="username">${profile.username}</span>
                                    </div>
                                    <div class="actions">
                                        <button class="btn cancel" onclick="cancelRequest('${f.id}')">Cancel</button>
                                    </div>
                                </div>
                            `;
                        }
                    } else if (f.status === 'accepted') {
                        friendsCount++;
                        friendsEl.innerHTML += `
                            <div class="request-card">
                                <div class="user-info">
                                    ${avatarContent}
                                    <span class="username">${profile.username}</span>
                                </div>
                                <div class="actions">
                                    <button class="btn cancel" onclick="cancelRequest('${f.id}')">Remove Friend</button>
                                </div>
                            </div>
                        `;
                    }
                });

                if (incomingCount === 0) incomingEl.innerHTML = '<div class="empty-state">No incoming requests.</div>';
                if (outgoingCount === 0) outgoingEl.innerHTML = '<div class="empty-state">No outgoing requests.</div>';
                if (friendsCount === 0) friendsEl.innerHTML = '<div class="empty-state">No friends added yet.</div>';

            } catch (err) {
                console.error('Error loading friendships:', err);
            }
        }

        async function updateStatus(id, status) {
            try {
                if (status === 'denied') {
                    // Delete the row if denied
                    await supabaseClient.from('friendships').delete().eq('id', id);
                } else {
                    await supabaseClient.from('friendships').update({ status }).eq('id', id);
                }
                loadFriendships();
            } catch (err) {
                console.error('Error updating friendship:', err);
            }
        }

        async function cancelRequest(id) {
            try {
                await supabaseClient.from('friendships').delete().eq('id', id);
                loadFriendships();
            } catch (err) {
                console.error('Error canceling request:', err);
            }
        }
    </script>
</body>
</html>

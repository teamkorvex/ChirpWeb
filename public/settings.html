<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chirp - Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body {
            background-color: #0f0f0f;
            color: #ededef;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Full Page Layout Wrapper */
        .settings-full-layout {
            display: flex;
            width: 100vw;
            height: 100vh;
            background-color: #0f0f0f;
            overflow: hidden;
        }

        /* Left Navigation Sidebar */
        .settings-sidebar {
            width: 280px;
            background-color: #0f0f0f;
            border-right: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            padding: 40px 20px 20px 60px;
            flex-shrink: 0;
        }

        .settings-sidebar-category {
            font-size: 11px;
            font-weight: 700;
            color: #71717a;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
            padding: 0 10px;
        }

        .settings-nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: transparent;
            border: none;
            color: #a1a1aa;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            width: 100%;
            transition: all 0.15s ease;
            margin-bottom: 2px;
        }
        .settings-nav-item:hover { background-color: #1e1f20; color: #f4f4f5; }
        .settings-nav-item.active { background-color: #1e1f20; color: #ffffff; font-weight: 600; }
        .settings-nav-item.danger { color: #f87171; }
        .settings-nav-item.danger:hover { background-color: rgba(248, 113, 113, 0.1); color: #f87171; }

        .settings-divider {
            height: 1px;
            background-color: rgba(255, 255, 255, 0.06);
            margin: 16px 10px;
        }

        /* Main Content Pane */
        .settings-content-area {
            flex: 1;
            background-color: #0f0f0f;
            display: flex;
            justify-content: flex-start;
            padding: 40px 60px;
            overflow-y: auto;
            position: relative;
        }

        .settings-container {
            max-width: 680px;
            width: 100%;
        }

        .settings-header {
            font-size: 20px;
            font-weight: 700;
            color: #f4f4f5;
            margin-bottom: 24px;
        }

        .settings-card {
            background-color: #1e1f20;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 16px;
        }
        .settings-card h4 {
            font-size: 11px;
            font-weight: 700;
            color: #71717a;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 16px;
        }

        .settings-field { margin-bottom: 16px; }
        .settings-field:last-child { margin-bottom: 0; }
        .settings-field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #a1a1aa;
            margin-bottom: 8px;
        }

        .settings-field input {
            width: 100%;
            background-color: #0f0f0f;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            padding: 10px 14px;
            color: #f4f4f5;
            font-size: 13px;
            outline: none;
            transition: border-color 0.15s;
        }
        .settings-field input:focus { border-color: #a78bfa; }

        .avatar-upload-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .avatar-preview-box {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background-color: #0f0f0f;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 600;
            color: #f4f4f5;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0; top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .settings-btn {
            background-color: #34d399;
            color: #0f0f0f;
            border: none;
            padding: 9px 18px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        .settings-btn:hover { background-color: #10b981; }
        .settings-btn.secondary {
            background-color: #0f0f0f;
            color: #f4f4f5;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .settings-btn.secondary:hover { background-color: #27272a; }

        .settings-msg { font-size: 12px; margin-top: 10px; display: none; }
        .settings-msg.error { color: #f87171; }
        .settings-msg.success { color: #34d399; }

        /* Close / Esc button style top right */
        .close-settings-esc {
            position: absolute;
            top: 40px;
            right: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }
        .esc-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #1e1f20;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a1a1aa;
            transition: all 0.15s;
        }
        .close-settings-esc:hover .esc-circle { border-color: #f4f4f5; color: #f4f4f5; background-color: #27272a; }
        .esc-label { font-size: 10px; font-weight: 700; color: #71717a; margin-top: 4px; letter-spacing: 0.5px; }

        /* Account Standing Custom Component */
        .standing-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #0f0f0f;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            padding: 16px 20px;
            cursor: pointer;
            transition: border-color 0.15s, background-color 0.15s;
        }
        .standing-row:hover {
            border-color: rgba(255, 255, 255, 0.12);
            background-color: #141416;
        }
        .standing-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .standing-icon-box {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background-color: rgba(52, 211, 153, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #34d399;
            flex-shrink: 0;
        }
        .standing-info h5 {
            font-size: 14px;
            font-weight: 600;
            color: #f4f4f5;
            margin-bottom: 3px;
        }
        .standing-info p {
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.4;
        }
        .standing-info p span {
            color: #60a5fa;
            cursor: pointer;
        }
        .standing-info p span:hover { text-decoration: underline; }
        
        .standing-right {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #f4f4f5;
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div class="settings-full-layout">
        <!-- Sidebar Navigation -->
        <div class="settings-sidebar">
            <div class="settings-sidebar-category">User Settings</div>
            <button class="settings-nav-item active" id="tab-btn-account" onclick="switchSettingsTab('account')">My Account</button>
            <button class="settings-nav-item" id="tab-btn-privacy" onclick="switchSettingsTab('privacy')">Privacy & Safety</button>
            
            <div class="settings-divider"></div>
            
            <div class="settings-sidebar-category">App Management</div>
            <button class="settings-nav-item" onclick="window.location.href='/chat.html'">Return to App</button>
            
            <div class="settings-divider"></div>
            
            <button class="settings-nav-item danger" onclick="handleLogout()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                <span>Log Out</span>
            </button>
        </div>

        <!-- Main Content Area -->
        <div class="settings-content-area" id="settings-pane-container">
            <!-- Dynamic tab content injected via JS -->
        </div>

        <!-- Esc / Close Button -->
        <div class="close-settings-esc" onclick="window.location.href='/chat.html'" title="Back to App">
            <div class="esc-circle">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </div>
            <span class="esc-label">ESC</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
    <script>
        let supabaseClient;
        let currentUser = null;
        let currentProfile = {};
        let activeSettingsTab = 'account';
        let selectedFileToUpload = null;

        async function init() {
            try {
                if (!Cookies.get('chirp_session')) return window.location.replace('/');
                const res = await fetch('/api/config');
                const config = await res.json();
                supabaseClient = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);

                const { data: { user }, error } = await supabaseClient.auth.getUser();
                if (error || !user) {
                    Cookies.remove('chirp_session', { path: '/' });
                    return window.location.replace('/');
                }
                currentUser = user;

                const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
                currentProfile = profile || {};

                renderSettingsContent();
            } catch (err) { window.location.replace('/'); }
        }
        init();

        async function handleLogout() {
            try {
                await supabaseClient.auth.signOut();
                Cookies.remove('chirp_session', { path: '/' });
                window.location.replace('/');
            } catch (e) { window.location.replace('/'); }
        }

        function switchSettingsTab(tabName) {
            activeSettingsTab = tabName;
            document.querySelectorAll('.settings-nav-item').forEach(b => {
                if(!b.classList.contains('danger') && !b.getAttribute('onclick')?.includes('chat.html')) {
                    b.classList.remove('active');
                }
            });
            document.getElementById(`tab-btn-${tabName}`).classList.add('active');
            renderSettingsContent();
        }

        function renderSettingsContent() {
            const container = document.getElementById('settings-pane-container');
            if (activeSettingsTab === 'account') {
                container.innerHTML = `
                    <div class="settings-container">
                        <div class="settings-header">My Account</div>
                        <div class="settings-card">
                            <h4>Profile Customization</h4>
                            <div class="settings-field">
                                <label>Profile Picture</label>
                                <div class="avatar-upload-row">
                                    <div id="avatar-preview-container">
                                        ${currentProfile.avatar_url ? `<img src="${currentProfile.avatar_url}" class="avatar-preview-box">` : `<div class="avatar-preview-box">${currentProfile.username ? currentProfile.username.charAt(0).toUpperCase() : '?'}</div>`}
                                    </div>
                                    <div class="upload-btn-wrapper">
                                        <button class="settings-btn secondary">Upload Image</button>
                                        <input type="file" id="avatar-file-input" accept="image/png, image/jpeg, image/gif, image/webp" onchange="previewAvatar(event)">
                                    </div>
                                </div>
                            </div>
                            <div class="settings-field" style="margin-top: 18px;">
                                <label>Username</label>
                                <input type="text" id="settings-username" value="${currentProfile.username || ''}">
                            </div>
                            <div id="settings-msg" class="settings-msg"></div>
                            <div style="margin-top: 20px;">
                                <button class="settings-btn" onclick="saveSettings()">Save Changes</button>
                            </div>
                        </div>
                    </div>
                `;
            } else if (activeSettingsTab === 'privacy') {
                container.innerHTML = `
                    <div class="settings-container">
                        <div class="settings-header">Privacy & Safety</div>
                        
                        <div class="settings-card">
                            <h4>Account Standing</h4>
                            <div class="standing-row" onclick="alert('Your account is in full compliance with Chirp guidelines.')">
                                <div class="standing-left">
                                    <div class="standing-icon-box">
                                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                    </div>
                                    <div class="standing-info">
                                        <h5>Account Standing</h5>
                                        <p>Thanks for upholding Chirp's <span>Terms of Service</span> and <span>Community Guidelines</span>. If you break the rules, it will show up here.</p>
                                    </div>
                                </div>
                                <div class="standing-right">
                                    <span>All good!</span>
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: #71717a;"><polyline points="9 18 15 12 9 6"></polyline></svg>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function previewAvatar(e) {
            const file = e.target.files[0];
            if (!file) return;
            selectedFileToUpload = file;
            const reader = new FileReader();
            reader.onload = function(evt) {
                document.getElementById('avatar-preview-container').innerHTML = `<img src="${evt.target.result}" class="avatar-preview-box">`;
            }
            reader.readAsDataURL(file);
        }

        async function saveSettings() {
            const newUsername = document.getElementById('settings-username').value.trim();
            const msgEl = document.getElementById('settings-msg');
            msgEl.style.display = 'none';

            if (!newUsername) {
                msgEl.innerText = 'Username cannot be empty.'; msgEl.className = 'settings-msg error'; msgEl.style.display = 'block'; return;
            }

            try {
                let avatarUrl = currentProfile.avatar_url;

                if (selectedFileToUpload) {
                    const fileExt = selectedFileToUpload.name.split('.').pop();
                    const fileName = `${currentUser.id}-${Math.random().toString(36).substring(2)}.${fileExt}`;
                    const filePath = `${fileName}`;

                    const { error: uploadErr } = await supabaseClient.storage.from('avatars').upload(filePath, selectedFileToUpload, { upsert: true });
                    if (uploadErr) {
                        msgEl.innerText = 'Error uploading file: ' + uploadErr.message; msgEl.className = 'settings-msg error'; msgEl.style.display = 'block'; return;
                    }

                    const { data: publicUrlData } = supabaseClient.storage.from('avatars').getPublicUrl(filePath);
                    avatarUrl = publicUrlData.publicUrl;
                }

                const { error } = await supabaseClient.from('profiles').update({
                    username: newUsername,
                    avatar_url: avatarUrl,
                    updated_at: new Date().toISOString()
                }).eq('id', currentUser.id);

                if (error) {
                    msgEl.innerText = error.message; msgEl.className = 'settings-msg error'; msgEl.style.display = 'block'; return;
                }

                currentProfile.username = newUsername;
                currentProfile.avatar_url = avatarUrl;
                selectedFileToUpload = null;

                msgEl.innerText = 'Settings saved successfully!'; msgEl.className = 'settings-msg success'; msgEl.style.display = 'block';
            } catch (err) {
                msgEl.innerText = 'An unexpected error occurred.'; msgEl.className = 'settings-msg error'; msgEl.style.display = 'block';
            }
        }
    </script>
</body>
</html>

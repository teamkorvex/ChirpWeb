<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chirp - Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body {
            background-color: #0f0f0f;
            color: #ededef;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Full Page Layout Wrapper */
        .settings-full-layout {
            display: flex;
            width: 100vw;
            height: 100vh;
            background-color: #0f0f0f;
            overflow: hidden;
        }

        /* Left Navigation Sidebar */
        .settings-sidebar {
            width: 280px;
            background-color: #0f0f0f;
            border-right: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            padding: 40px 20px 20px 60px;
            flex-shrink: 0;
        }

        .settings-sidebar-category {
            font-size: 11px;
            font-weight: 700;
            color: #71717a;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
            padding: 0 10px;
        }

        .settings-nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: transparent;
            border: none;
            color: #a1a1aa;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            width: 100%;
            transition: all 0.15s ease;
            margin-bottom: 2px;
        }
        .settings-nav-item:hover { background-color: #1e1f20; color: #f4f4f5; }
        .settings-nav-item.active { background-color: #1e1f20; color: #ffffff; font-weight: 600; }
        .settings-nav-item.danger { color: #f87171; }
        .settings-nav-item.danger:hover { background-color: rgba(248, 113, 113, 0.1); color: #f87171; }

        .settings-divider {
            height: 1px;
            background-color: rgba(255, 255, 255, 0.06);
            margin: 16px 10px;
        }

        /* Main Content Pane */
        .settings-content-area {
            flex: 1;
            background-color: #0f0f0f;
            display: flex;
            justify-content: flex-start;
            padding: 40px 60px;
            overflow-y: auto;
            position: relative;
        }

        .settings-container {
            max-width: 680px;
            width: 100%;
        }

        .settings-header {
            font-size: 20px;
            font-weight: 700;
            color: #f4f4f5;
            margin-bottom: 24px;
        }

        .settings-card {
            background-color: #1e1f20;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 16px;
        }
        .settings-card h4 {
            font-size: 11px;
            font-weight: 700;
            color: #71717a;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 16px;
        }

        .settings-field { margin-bottom: 16px; }
        .settings-field:last-child { margin-bottom: 0; }
        .settings-field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #a1a1aa;
            margin-bottom: 8px;
        }

        .settings-field input {
            width: 100%;
            background-color: #0f0f0f;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            padding: 10px 14px;
            color: #f4f4f5;
            font-size: 13px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .settings-field input:focus { border-color: #a78bfa; }
        
        /* Dynamic Validation States for Username Input */
        .settings-field input.is-valid {
            border-color: #34d399 !important;
            box-shadow: 0 0 0 1px rgba(52, 211, 153, 0.2);
        }
        .settings-field input.is-invalid {
            border-color: #f87171 !important;
            box-shadow: 0 0 0 1px rgba(248, 113, 113, 0.2);
        }

        .avatar-upload-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .avatar-preview-box {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background-color: #0f0f0f;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 600;
            color: #f4f4f5;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0; top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .settings-btn {
            background-color: #34d399;
            color: #0f0f0f;
            border: none;
            padding: 9px 18px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        .settings-btn:hover { background-color: #10b981; }
        .settings-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .settings-btn.secondary {
            background-color: #0f0f0f;
            color: #f4f4f5;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .settings-btn.secondary:hover { background-color: #27272a; }

        .settings-msg { font-size: 12px; margin-top: 6px; display: block; }
        .settings-msg.error { color: #f87171; }
        .settings-msg.success { color: #34d399; }
        .settings-msg.neutral { color: #71717a; }

        /* Close control style top right */
        .close-settings-esc {
            position: absolute;
            top: 40px;
            right: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .esc-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #1e1f20;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a1a1aa;
            transition: all 0.15s;
        }
        .close-settings-esc:hover .esc-circle { border-color: #f4f4f5; color: #f4f4f5; background-color: #27272a; }

        /* Account Standing Custom Component */
        .standing-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #0f0f0f;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            padding: 16px 20px;
            cursor: pointer;
            transition: border-color 0.15s, background-color 0.15s;
        }
        .standing-row:hover {
            border-color: rgba(255, 255, 255, 0.12);
            background-color: #141416;
        }
        .standing-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .standing-icon-box {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background-color: rgba(52, 211, 153, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #34d399;
            flex-shrink: 0;
        }
        .standing-info h5 {
            font-size: 14px;
            font-weight: 600;
            color: #f4f4f5;
            margin-bottom: 3px;
        }
        .standing-info p {
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.4;
        }
        .standing-info p span {
            color: #60a5fa;
            cursor: pointer;
        }
        .standing-info p span:hover { text-decoration: underline; }
        
        .standing-right {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #f4f4f5;
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .privacy-toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 0;
            border-top: 1px solid rgba(255,255,255,0.04);
        }
        .privacy-toggle-row:first-child { border-top: none; padding-top: 0; }
        .privacy-toggle-text {
            flex: 1;
            min-width: 0;
        }
        .privacy-toggle-text h5 {
            font-size: 14px;
            font-weight: 600;
            color: #f4f4f5;
            margin: 0 0 4px;
        }
        .privacy-toggle-text p {
            font-size: 12px;
            color: #a1a1aa;
            margin: 0;
            line-height: 1.45;
        }
        .privacy-toggle-switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 26px;
            flex-shrink: 0;
        }
        .privacy-toggle-switch input {
            position: absolute;
            opacity: 0;
            inset: 0;
            cursor: pointer;
        }
        .privacy-toggle-slider {
            position: absolute;
            inset: 0;
            background-color: #27272a;
            border-radius: 26px;
            transition: background 0.2s ease;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .privacy-toggle-slider::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            left: 2px;
            top: 2px;
            background-color: #ffffff;
            transition: transform 0.2s ease;
        }
        .privacy-toggle-switch input:checked + .privacy-toggle-slider {
            background-color: #34d399;
        }
        .privacy-toggle-switch input:checked + .privacy-toggle-slider::before {
            transform: translateX(20px);
            background-color: #0f0f0f;
        }
    </style>
</head>
<body>

    <div class="settings-full-layout">
        <div class="settings-sidebar">
            <div class="settings-sidebar-category">User Settings</div>
            <button class="settings-nav-item active" id="tab-btn-account" onclick="switchSettingsTab('account')">My Account</button>
            <button class="settings-nav-item" id="tab-btn-privacy" onclick="switchSettingsTab('privacy')">Privacy & Safety</button>
            
            <div class="settings-divider"></div>
            
            <button class="settings-nav-item danger" onclick="handleLogout()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                <span>Log Out</span>
            </button>
        </div>

        <div class="settings-content-area" id="settings-pane-container">
            </div>

        <div class="close-settings-esc" onclick="window.location.href='/chat'" title="Back to App">
            <div class="esc-circle">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
    <script>
        let supabaseClient;
        let currentUser = null;
        let currentProfile = {};
        let activeSettingsTab = 'account';
        let selectedFileToUpload = null;
        let usernameCheckTimer = null;
        let isUsernameAvailable = true;

        async function init() {
            try {
                if (!Cookies.get('chirp_session')) return window.location.replace('/');
                const res = await fetch('/api/config');
                const config = await res.json();
                if (!res.ok || !config.supabaseUrl || !config.supabaseAnonKey) {
                    throw new Error(config.error || 'Supabase configuration is unavailable.');
                }
                supabaseClient = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);

                const { data: { user }, error } = await supabaseClient.auth.getUser();
                if (error || !user) {
                    Cookies.remove('chirp_session', { path: '/' });
                    return window.location.replace('/');
                }
                currentUser = user;

                const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
                currentProfile = profile || {};

                renderSettingsContent();
            } catch (err) { window.location.replace('/'); }
        }
        init();

        async function handleLogout() {
            try {
                await supabaseClient.auth.signOut();
                Cookies.remove('chirp_session', { path: '/' });
                window.location.replace('/');
            } catch (e) { window.location.replace('/'); }
        }

        function switchSettingsTab(tabName) {
            activeSettingsTab = tabName;
            document.querySelectorAll('.settings-nav-item').forEach(b => {
                if(!b.classList.contains('danger') && !b.getAttribute('onclick')?.includes('chat')) {
                    b.classList.remove('active');
                }
            });
            document.getElementById(`tab-btn-${tabName}`).classList.add('active');
            renderSettingsContent();
        }

        function renderSettingsContent() {
            const container = document.getElementById('settings-pane-container');
            if (activeSettingsTab === 'account') {
                container.innerHTML = `
                    <div class="settings-container">
                        <div class="settings-header">My Account</div>
                        <div class="settings-card">
                            <h4>Profile Customization</h4>
                            <div class="settings-field">
                                <label>Profile Picture</label>
                                <div class="avatar-upload-row">
                                    <div id="avatar-preview-container">
                                        ${currentProfile.avatar_url ? `<img src="${currentProfile.avatar_url}" class="avatar-preview-box">` : `<div class="avatar-preview-box">${currentProfile.username ? currentProfile.username.charAt(0).toUpperCase() : '?'}</div>`}
                                    </div>
                                    <div class="upload-btn-wrapper">
                                        <button class="settings-btn secondary">Upload Image</button>
                                        <input type="file" id="avatar-file-input" accept="image/png, image/jpeg, image/gif, image/webp" onchange="previewAvatar(event)">
                                    </div>
                                </div>
                            </div>
                            <div class="settings-field" style="margin-top: 18px;">
                                <label>Username</label>
                                <input type="text" id="settings-username" value="${currentProfile.username || ''}" oninput="handleUsernameInput(event)" autocomplete="off" spellcheck="false">
                                <span id="username-status-msg" class="settings-msg neutral">This is your public display name.</span>
                            </div>
                            <div id="settings-global-msg" class="settings-msg" style="margin-top: 10px; display: none;"></div>
                            <div style="margin-top: 20px;">
                                <button class="settings-btn" id="save-settings-btn" onclick="saveSettings()">Save Changes</button>
                            </div>
                        </div>
                    </div>
                `;
                // Run an initial check layout check style
                if (currentProfile.username) {
                    const input = document.getElementById('settings-username');
                    if(input) input.classList.add('is-valid');
                }
            } else if (activeSettingsTab === 'privacy') {
                const incomingDisabled = Boolean(currentProfile.friend_requests_disabled);
                container.innerHTML = `
                    <div class="settings-container">
                        <div class="settings-header">Privacy & Safety</div>

                        <div class="settings-card">
                            <h4>Friend Requests</h4>
                            <div class="privacy-toggle-row">
                                <div class="privacy-toggle-text">
                                    <h5>Only send requests myself</h5>
                                    <p>When enabled, people cannot send friend requests to you. You must start the request toward them instead.</p>
                                </div>
                                <label class="privacy-toggle-switch">
                                    <input type="checkbox" id="friend-requests-disabled-toggle" ${incomingDisabled ? 'checked' : ''} onchange="saveFriendRequestSetting(this.checked)">
                                    <span class="privacy-toggle-slider"></span>
                                </label>
                            </div>
                        </div>

                        <div class="settings-card">
                            <h4>Account Standing</h4>
                            <div class="standing-row" onclick="alert('Your account is in full compliance with Chirp guidelines.')">
                                <div class="standing-left">
                                    <div class="standing-icon-box">
                                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                    </div>
                                    <div class="standing-info">
                                        <h5>Account Standing</h5>
                                        <p>Thanks for upholding Chirp's <span>Terms of Service</span> and <span>Community Guidelines</span>. If you break the rules, it will show up here.</p>
                                    </div>
                                </div>
                                <div class="standing-right">
                                    <span>All good!</span>
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: #71717a;"><polyline points="9 18 15 12 9 6"></polyline></svg>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function previewAvatar(e) {
            const file = e.target.files[0];
            if (!file) return;
            selectedFileToUpload = file;
            const reader = new FileReader();
            reader.onload = function(evt) {
                document.getElementById('avatar-preview-container').innerHTML = `<img src="${evt.target.result}" class="avatar-preview-box">`;
            }
            reader.readAsDataURL(file);
        }

        // Real-time username input listener with debounce
        function handleUsernameInput(e) {
            const val = e.target.value.trim();
            const msgEl = document.getElementById('username-status-msg');
            const saveBtn = document.getElementById('save-settings-btn');
            const inputEl = e.target;

            clearTimeout(usernameCheckTimer);

            // Basic validation
            if (!val) {
                inputEl.className = 'is-invalid';
                msgEl.innerText = 'Username cannot be empty.';
                msgEl.className = 'settings-msg error';
                isUsernameAvailable = false;
                if(saveBtn) saveBtn.disabled = true;
                return;
            }

            if (val.length < 3) {
                inputEl.className = 'is-invalid';
                msgEl.innerText = 'Username must be at least 3 characters long.';
                msgEl.className = 'settings-msg error';
                isUsernameAvailable = false;
                if(saveBtn) saveBtn.disabled = true;
                return;
            }

            // If it's the exact same username they already have, it's safe
            if (val === currentProfile.username) {
                inputEl.className = 'is-valid';
                msgEl.innerText = 'This is your current username.';
                msgEl.className = 'settings-msg success';
                isUsernameAvailable = true;
                if(saveBtn) saveBtn.disabled = false;
                return;
            }

            inputEl.className = '';
            msgEl.innerText = 'Checking availability...';
            msgEl.className = 'settings-msg neutral';

            // Debounce request to database
            usernameCheckTimer = setTimeout(async () => {
                try {
                    const { data, error } = await supabaseClient
                        .from('profiles')
                        .select('id')
                        .eq('username', val)
                        .maybeSingle();

                    if (error) throw error;

                    if (data && data.id !== currentUser.id) {
                        inputEl.className = 'is-invalid';
                        msgEl.innerText = 'Username is already taken.';
                        msgEl.className = 'settings-msg error';
                        isUsernameAvailable = false;
                        if(saveBtn) saveBtn.disabled = true;
                    } else {
                        inputEl.className = 'is-valid';
                        msgEl.innerText = 'This username is available!';
                        msgEl.className = 'settings-msg success';
                        isUsernameAvailable = true;
                        if(saveBtn) saveBtn.disabled = false;
                    }
                } catch (err) {
                    inputEl.className = 'is-invalid';
                    msgEl.innerText = 'Error checking availability.';
                    msgEl.className = 'settings-msg error';
                    isUsernameAvailable = false;
                    if(saveBtn) saveBtn.disabled = true;
                }
            }, 400);
        }

        async function saveFriendRequestSetting(disabled) {
            try {
                const { error } = await supabaseClient.from('profiles').update({
                    friend_requests_disabled: disabled,
                    updated_at: new Date().toISOString()
                }).eq('id', currentUser.id);

                if (error) {
                    const msg = document.getElementById('settings-global-msg') || document.createElement('div');
                    msg.innerText = error.message;
                    msg.className = 'settings-msg error';
                    msg.style.display = 'block';
                    return;
                }

                currentProfile.friend_requests_disabled = disabled;
                const msg = document.getElementById('settings-global-msg') || document.createElement('div');
                msg.innerText = disabled ? 'Incoming friend requests are now disabled.' : 'Incoming friend requests are now enabled.';
                msg.className = 'settings-msg success';
                msg.style.display = 'block';
            } catch (err) {
                const msg = document.getElementById('settings-global-msg') || document.createElement('div');
                msg.innerText = 'Unable to save privacy setting.';
                msg.className = 'settings-msg error';
                msg.style.display = 'block';
            }
        }

        async function saveSettings() {
            const newUsername = document.getElementById('settings-username').value.trim();
            const globalMsgEl = document.getElementById('settings-global-msg');
            globalMsgEl.style.display = 'none';

            if (!isUsernameAvailable) {
                globalMsgEl.innerText = 'Please choose an available username before saving.';
                globalMsgEl.className = 'settings-msg error';
                globalMsgEl.style.display = 'block';
                return;
            }

            try {
                let avatarUrl = currentProfile.avatar_url;

                if (selectedFileToUpload) {
                    const fileExt = selectedFileToUpload.name.split('.').pop();
                    const fileName = `${currentUser.id}-${Math.random().toString(36).substring(2)}.${fileExt}`;
                    const filePath = `${fileName}`;

                    const { error: uploadErr } = await supabaseClient.storage.from('avatars').upload(filePath, selectedFileToUpload, { upsert: true });
                    if (uploadErr) {
                        globalMsgEl.innerText = 'Error uploading file: ' + uploadErr.message;
                        globalMsgEl.className = 'settings-msg error';
                        globalMsgEl.style.display = 'block';
                        return;
                    }

                    const { data: publicUrlData } = supabaseClient.storage.from('avatars').getPublicUrl(filePath);
                    avatarUrl = publicUrlData.publicUrl;
                }

                const { error } = await supabaseClient.from('profiles').update({
                    username: newUsername,
                    avatar_url: avatarUrl,
                    updated_at: new Date().toISOString()
                }).eq('id', currentUser.id);

                if (error) {
                    globalMsgEl.innerText = error.message;
                    globalMsgEl.className = 'settings-msg error';
                    globalMsgEl.style.display = 'block';
                    return;
                }

                currentProfile.username = newUsername;
                currentProfile.avatar_url = avatarUrl;
                selectedFileToUpload = null;

                globalMsgEl.innerText = 'Settings saved successfully!';
                globalMsgEl.className = 'settings-msg success';
                globalMsgEl.style.display = 'block';
            } catch (err) {
                globalMsgEl.innerText = 'An unexpected error occurred.';
                globalMsgEl.className = 'settings-msg error';
                globalMsgEl.style.display = 'block';
            }
        }
    </script>
</body>
</html>
